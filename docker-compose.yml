# Mockpit with Docker Compose:
#   docker compose up -d
#   docker compose logs mockpit   # the generated password is printed on the first start
# Then open http://<this machine>:3300
services:
  mockpit:
    image: ghcr.io/mcbane23/mockoon-web:latest
    container_name: mockpit
    restart: unless-stopped
    ports:
      # the interface and its API
      - '3300:3300'
      # the mock APIs: environments get ports from 3001 up; widen the range if you need more
      - '3001-3020:3001-3020'
    environment:
      # Set a fixed password here, or leave it out and read the generated one from the logs
      # MOCKPIT_PASSWORD: change-me
      MOCKPIT_AUTH: 'on'
    volumes:
      # settings, password and the environment JSON files
      - mockpit-data:/data
      # To keep the files in a folder next to this file instead, use the line below
      # (the folder must be writable by uid 1000: mkdir data && sudo chown 1000:1000 data)
      # - ./data:/data

volumes:
  mockpit-data:
